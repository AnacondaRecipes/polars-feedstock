package:
  name: {{ name|lower }}-split
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
    sha256: c699671b99eb71ff53334d237917aaa3db5ad4dda480abcb6c80e0eaee7b677b
  - url: https://github.com/pola-rs/{{ name }}/archive/refs/tags/py-{{ version }}.tar.gz
    sha256: ad5e5bd9d6184a7b273e85e579e4a20b0ead22503563f523159527a121d7ab4d
    folder: gh
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}-runtime-32/{{ name }}_runtime_32-{{ version }}.tar.gz
    sha256: d7b7c486bccee75a6af0158b87077da3d054657e3c60036b28644f4e1c7fdbf7
    folder: polars-runtime-32
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}-runtime-64/{{ name }}_runtime_64-{{ version }}.tar.gz
    sha256: 096eb2817d3ff566508883e66acb95cc54a0480976a00b822d669a738854ad13
    folder: polars-runtime-64
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}-runtime-compat/{{ name }}_runtime_compat-{{ version }}.tar.gz
    sha256: d5872963e22bba149b7f8c892ed0037ee80078d42410aef4fa869786ac46a8e8
    folder: polars-runtime-compat

build:
  number: 0
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
  run:
    - python

outputs:
  - name: polars-runtime-32
    script: build_runtime.sh  # [not win]
    script: build_runtime.bat  # [win]
    requirements:
      build:
        - {{ stdlib('c') }}  # [linux]
        - {{ compiler('c') }}  # [linux]
        - {{ compiler('cxx') }}  # [linux]
        - {{ compiler('rust-nightly') }}
        - cargo-auditable
        - cargo-bundle-licenses
      host:
        - pip
        - python
        - maturin >=1.3.2,<2
      run:
        - python
    test:
      imports:
        - _polars_runtime_32
      requires:
        - pip
      commands:
        - pip check
    about:
      home: https://www.pola.rs
      license: MIT
      license_family: MIT
      license_file:
        - polars-runtime-32/LICENSE
        - polars-runtime-32/THIRDPARTY.yml
      summary: Polars is a blazingly fast DataFrames library implemented in Rust using Apache Arrow(2) as memory model.
      description: |
        Polars is a blazingly fast DataFrame library for manipulating structured data. The core is written in Rust, and
        available for Python, R and NodeJS.
        Key features:
        * Fast: Written from scratch in Rust, designed close to the machine and without external dependencies.
        * I/O: First class support for all common data storage layers: local, cloud storage & databases.
        * Intuitive API: Write your queries the way they were intended. Polars, internally, will determine the most efficient way to execute using its query optimizer.
        * Out of Core: The streaming API allows you to process your results without requiring all your data to be in memory at the same time
        * Parallel: Utilities the power of your machine by dividing the workload among the available CPU cores without any additional configuration.
        * Vectorized Query Engine: Using Apache Arrow, a columnar data format, to process your queries in a vectorized manner and SIMD to optimize CPU usage.
      doc_url: https://docs.pola.rs/api/python/stable/reference/index.html
      dev_url: https://github.com/pola-rs/polars
  - name: polars-runtime-64
    script: build_runtime.sh  # [not win]
    script: build_runtime.bat  # [win]
    requirements:
      build:
        - {{ stdlib('c') }}  # [linux]
        - {{ compiler('c') }}  # [linux]
        - {{ compiler('cxx') }}  # [linux]
        - {{ compiler('rust-nightly') }}
        - cargo-auditable
        - cargo-bundle-licenses
      host:
        - pip
        - python
        - maturin >=1.3.2,<2
      run:
        - python
    test:
      imports:
        - _polars_runtime_64
      requires:
        - pip
      commands:
        - pip check
    about:
      home: https://www.pola.rs
      license: MIT
      license_family: MIT
      license_file:
        - polars-runtime-64/LICENSE
        - polars-runtime-64/THIRDPARTY.yml
      summary: Polars is a blazingly fast DataFrames library implemented in Rust using Apache Arrow(2) as memory model.
      description: |
        Polars is a blazingly fast DataFrame library for manipulating structured data. The core is written in Rust, and
        available for Python, R and NodeJS.
        Key features:
        * Fast: Written from scratch in Rust, designed close to the machine and without external dependencies.
        * I/O: First class support for all common data storage layers: local, cloud storage & databases.
        * Intuitive API: Write your queries the way they were intended. Polars, internally, will determine the most efficient way to execute using its query optimizer.
        * Out of Core: The streaming API allows you to process your results without requiring all your data to be in memory at the same time
        * Parallel: Utilities the power of your machine by dividing the workload among the available CPU cores without any additional configuration.
        * Vectorized Query Engine: Using Apache Arrow, a columnar data format, to process your queries in a vectorized manner and SIMD to optimize CPU usage.
      doc_url: https://docs.pola.rs/api/python/stable/reference/index.html
      dev_url: https://github.com/pola-rs/polars
  - name: polars-runtime-compat
    script: build_runtime.sh  # [not win]
    script: build_runtime.bat  # [win]
    requirements:
      build:
        - {{ stdlib('c') }}  # [linux]
        - {{ compiler('c') }}  # [linux]
        - {{ compiler('cxx') }}  # [linux]
        - {{ compiler('rust-nightly') }}
        - cargo-auditable
        - cargo-bundle-licenses
      host:
        - pip
        - python
        - maturin >=1.3.2,<2
      run:
        - python
    test:
      imports:
        - _polars_runtime_compat
      requires:
        - pip
      commands:
        - pip check
    about:
      home: https://www.pola.rs
      license: MIT
      license_family: MIT
      license_file:
        - polars-runtime-compat/LICENSE
        - polars-runtime-compat/THIRDPARTY.yml
      summary: Polars is a blazingly fast DataFrames library implemented in Rust using Apache Arrow(2) as memory model.
      description: |
        Polars is a blazingly fast DataFrame library for manipulating structured data. The core is written in Rust, and
        available for Python, R and NodeJS.
        Key features:
        * Fast: Written from scratch in Rust, designed close to the machine and without external dependencies.
        * I/O: First class support for all common data storage layers: local, cloud storage & databases.
        * Intuitive API: Write your queries the way they were intended. Polars, internally, will determine the most efficient way to execute using its query optimizer.
        * Out of Core: The streaming API allows you to process your results without requiring all your data to be in memory at the same time
        * Parallel: Utilities the power of your machine by dividing the workload among the available CPU cores without any additional configuration.
        * Vectorized Query Engine: Using Apache Arrow, a columnar data format, to process your queries in a vectorized manner and SIMD to optimize CPU usage.
      doc_url: https://docs.pola.rs/api/python/stable/reference/index.html
      dev_url: https://github.com/pola-rs/polars
  - name: {{ name }}
    script: build_polars.sh  # [not win]
    script: build_polars.bat  # [win]
    requirements:
      host:
        - pip
        - python
        - setuptools >=61
        - wheel
      run:
        - python
        - {{ pin_subpackage('polars-runtime-32', exact=True) }}
      run_constrained:
        - numpy >=1.16.0
        - pyarrow >=7.0.0
        - fastexcel >=0.9
        - openpyxl >=3.0.0
        - xlsx2csv >=0.8.0
        - connectorx >=0.3.2
        - deltalake >=1.0.0,!=1.5.*
        - pyiceberg >=0.7.1
        - altair >=5.4.0
        - great_tables >=0.8.0
        - polars-runtime-64 =={{ version }}
        - polars-runtime-compat =={{ version }}
    # ModuleNotFoundError: No module named 'deltalake'
    # ModuleNotFoundError: No module named 'pyiceberg'
    # _ ERROR collecting gh/py-polars/tests/unit/testing/parametric/strategies/test_utils.py _
    # import file mismatch:
    # imported module 'test_utils' has this __file__ attribute:
    # ModuleNotFoundError: No module named 'kuzu'
    # ModuleNotFoundError: required package 'fastexcel' not found
    # Number of modules are missing like xlsx2csv, fastexcel, connectorx
    # ModuleNotFoundError: str_leven requires 'polars_ds' module to be installed
    # Failed: DID NOT RAISE <class 'UserWarning'>
    # AssertionError: Series are different (values not within tolerance)
    # ModuleNotFoundError: str_leven requires 'polars_ds' module to be installed
    # ModuleNotFoundError: No module named 'azure'
    # AssertionError: assert table["a"].type == pa_dtype
    # AssertionError: DataFrames are different (value mismatch for column "a")
    # AssertionError: assert large_utf8: l...ryview: binary == large_utf8: l...w: binary_view
    # Failed: DID NOT RAISE <class 'polars.exceptions.PerformanceWarning'>
    # AssertionError: DataFrames are different (dtypes do not match)
    # [left]: [Int32, UInt32, UInt32]
    # [right]: [Int64, UInt32, UInt32]
    #   Failed: DID NOT RAISE <class 'polars.exceptions.ChronoFormatWarning'>
    # E   AttributeError: 'RecordBatchFileReader' object has no attribute 'metadata'
    # E   pyarrow.lib.ArrowNotImplementedError: Unhandled type for Arrow to Parquet schema conversion: decimal32(4, 1)
    # >   assert "IdxSize limit hit; chunking branch hit" in captured
    # E   AssertionError: assert 'IdxSize limit hit; chunking branch hit' in ''
    # >   return function(*args, **kwargs)
    # E   AssertionError: DataFrames are different (value mismatch for column "a")
    test:
      source_files:
        - gh/py-polars/tests
      imports:
        - polars
      commands:
        - pip check
        - pytest -v gh/py-polars/tests {{ ignore_tests }} {{ deselect_tests }}
      requires:
        - pip
        - pytest
        - pytz
        - flask
        - flask-cors
        - orjson
        - altair
        - pytorch
        - jax
        - hypothesis >=6.97.4
        - polars-runtime-32 =={{ version }}
        - pyarrow
        - pandas
        - boto3
        - sqlalchemy
        - moto
        - pydantic
        - zstandard
        - matplotlib
        - nest-asyncio
        - cloudpickle
        - fsspec
        - gevent
        - openpyxl >=3.0.0
        - pandas
        - hvplot >=0.9.1
        - pyarrow >=7.0.0
        - pydantic >=2.0.0
        - pyxlsb >=1.0  # [py<312]
        - sqlalchemy
        - backports.zoneinfo  # [py<39]
        - tzdata  # [win]
        - xlsxwriter
        - aiosqlite

