# polars' TLS stack uses aws-lc-rs -> aws-lc-sys, which does not support MSVC
# cl.exe when targeting aarch64-pc-windows-msvc; it requires a clang driver.
# ring 0.17 looks up clang by name on aarch64-pc-windows-msvc
# Use clang on win-arm64 (MSVC remains the compiler everywhere else).
c_compiler:            # [win and arm64]
  - clang              # [win and arm64]
c_compiler_version:    # [win and arm64]
  - 20                 # [win and arm64]